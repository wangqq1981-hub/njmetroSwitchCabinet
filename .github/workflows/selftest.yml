name: pipeline-selftest

on:
  push:
    branches: [main, cursor/**]
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Run decompile/rebuild selftest
        run: bash scripts/selftest.sh
